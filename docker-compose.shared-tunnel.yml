# For a host that already runs cloudflared in another compose project (e.g. the Plex
# "mediastack"). TurboBooks joins that project's network so the existing tunnel can
# reach it at http://turbobooks:8080; no second cloudflared and no published ports.
#
# Use it by putting this in .env:
#   COMPOSE_FILE=docker-compose.shared-tunnel.yml
#   TUNNEL_NETWORK=mediastack_default
# then `docker compose up -d --build` as usual.
#
# This file does not start Shelfarr/Prowlarr/qBittorrent (docker-compose.yml does), since a host
# like this usually runs its own. Point SHELFARR_URL in .env at yours, then paste its token in
# Settings > Requests (or set SHELFARR_TOKEN).
services:
  turbobooks:
    build: .
    image: turbobooks:latest
    container_name: turbobooks
    restart: unless-stopped
    env_file: .env
    environment:
      # Read along (syncing ebook text to audiobooks). Set WHISPER_URL= (empty) in .env to turn it off.
      WHISPER_URL: ${WHISPER_URL-http://whisper:9000}
    volumes:
      - ./data:/data
      - ${LIBRARY_PATH:-./library}:/library
    networks:
      - tunnel
      - internal
    # Optional LAN access at http://<vm-ip>:8095 (8080 is often taken, e.g. by qBittorrent).
    # ports:
    #   - "8095:8080"

  # Text-to-speech for ebook → audiobook conversion. GPU-backed, reachable only by TurboBooks
  # (internal network, no published ports). Needs the NVIDIA container toolkit on the host.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.2
    container_name: turbobooks-kokoro
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Speech recognition for "Read along": lines an ebook's text up with its audiobook. GPU-backed,
  # only TurboBooks talks to it. The model (~0.5 GB) downloads into ./data/whisper on first use,
  # which is why this one container also gets outbound internet; it leaves the GPU after 10 idle minutes.
  whisper:
    # v1.9.1: CUDA 12.6. v1.10 needs CUDA 12.9, newer than the host's NVIDIA driver 570 (12.8).
    image: onerahmet/openai-whisper-asr-webservice:v1.9.1-gpu
    container_name: turbobooks-whisper
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: small
      ASR_QUANTIZATION: float16
      MODEL_IDLE_TIMEOUT: "600"
    volumes:
      - ./data/whisper:/root/.cache/whisper
    networks:
      - internal
      - downloads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  internal:
    internal: true
  downloads: {}
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-mediastack_default}
