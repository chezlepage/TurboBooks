services:
  turbobooks:
    build: .
    image: turbobooks:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # The request apps below. Admins open them from Settings → Requests, where they also connect
      # TurboBooks to Shelfarr. Nothing else can reach them: their web ports are never published.
      SHELFARR_URL: ${SHELFARR_URL:-http://shelfarr/apps/shelfarr}
      APP_SHELFARR_URL: http://shelfarr
      APP_PROWLARR_URL: http://prowlarr:9696
      APP_QBITTORRENT_URL: http://qbittorrent:8090
    volumes:
      - ./data:/data                        # SQLite DB + extracted covers (back this up)
      - ${LIBRARY_PATH:-./library}:/library # audio files
    # No published ports: only cloudflared can reach the app.
    # Uncomment to also use it on your LAN at http://<vm-ip>:8080 (then set COOKIE_SECURE=false).
    # ports:
    #   - "8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - turbobooks

  # ── Requests ──────────────────────────────────────────────────────────────────
  # Shelfarr takes book requests, Prowlarr searches the indexers you add, qBittorrent downloads.
  # Their web pages are served only through TurboBooks, to TurboBooks admins (Settings → Requests),
  # so Prowlarr and qBittorrent skip their own logins. docs/REQUESTS.md walks through setup.

  shelfarr:
    image: ghcr.io/pedro-revez-silva/shelfarr:${SHELFARR_VERSION:-2026.11.09.1}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      SOLID_QUEUE_IN_PUMA: "1"
      RAILS_RELATIVE_URL_ROOT: /apps/shelfarr
    volumes:
      - ./data/shelfarr:/rails/storage                                # its database and keys
      - ${DOWNLOADS_PATH:-./downloads}:/downloads                     # same folder qBittorrent saves to
      - ${LIBRARY_PATH:-./library}/Requested/Audiobooks:/audiobooks   # finished books land in the
      - ${LIBRARY_PATH:-./library}/Requested/Ebooks:/ebooks           # TurboBooks library
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/apps/shelfarr/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      PROWLARR__SERVER__URLBASE: /apps/prowlarr
      PROWLARR__AUTH__METHOD: External    # the TurboBooks admin login guards it
    volumes:
      - ./data/prowlarr:/config

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: "8090"
      TORRENTING_PORT: "6881"
    # On first start, turn off qBittorrent's own web login: the TurboBooks admin login guards it,
    # and only TurboBooks and Shelfarr can reach its unpublished web port.
    entrypoint:
      - /bin/sh
      - -c
      - |
        conf=/config/qBittorrent/qBittorrent.conf
        if [ ! -f "$$conf" ]; then
          mkdir -p /config/qBittorrent
          cp /defaults/qBittorrent.conf "$$conf"
          printf '%s\n' 'WebUI\AuthSubnetWhitelistEnabled=true' 'WebUI\AuthSubnetWhitelist=0.0.0.0/0, ::/0' >> "$$conf"
        fi
        exec /init
    volumes:
      - ./data/qbittorrent:/config
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
      - "6881:6881"        # for torrent peers, not the web page
      - "6881:6881/udp"
